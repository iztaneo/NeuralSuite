name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Compila y ejecuta la suite numerica en las tres plataformas que anuncia el
  # README, en los dos modos de build. Debug importa tanto como Release: es el
  # unico que activa la comprobacion de indices de Tensor::operator[].
  build-and-test:
    name: ${{ matrix.name }} · ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    # Las combinaciones se enumeran una a una en lugar de cruzar dimensiones con
    # `include`: las reglas de fusion de GitHub Actions en ese caso son sutiles
    # y aqui no hay forma de comprobarlas antes de ejecutar el workflow.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Linux GCC,        os: ubuntu-latest,  build_type: Debug,   cc: gcc,   cxx: g++}
          - {name: Linux GCC,        os: ubuntu-latest,  build_type: Release, cc: gcc,   cxx: g++}
          - {name: Linux Clang,      os: ubuntu-latest,  build_type: Debug,   cc: clang, cxx: clang++}
          - {name: Linux Clang,      os: ubuntu-latest,  build_type: Release, cc: clang, cxx: clang++}
          - {name: macOS AppleClang, os: macos-latest,   build_type: Debug}
          - {name: macOS AppleClang, os: macos-latest,   build_type: Release}
          - {name: Windows MSVC,     os: windows-latest, build_type: Debug}
          - {name: Windows MSVC,     os: windows-latest, build_type: Release}

    steps:
      - uses: actions/checkout@v4

      - name: Configurar compilador
        if: matrix.cc != ''
        shell: bash
        run: |
          echo "CC=${{ matrix.cc }}" >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"

      - name: Configurar
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Compilar
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Pruebas
        working-directory: build
        run: ctest --output-on-failure --build-config ${{ matrix.build_type }}

      # Las demos son parte del contrato del repositorio: si una deja de
      # ejecutarse, el fallo debe verse aqui y no cuando alguien la prueba.
      - name: Ejecutar demos
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bin_dir="build"
          failed=0
          # Las demos salen del directorio, no de una lista escrita a mano:
          # esa lista ya se olvido de train_ocr durante dias.
          for src in demos/*.cpp; do
            demo=$(basename "${src}" .cpp)
            if ! "./${bin_dir}/${demo}" > /dev/null 2>&1; then
              echo "FALLO la demo ${demo}"
              exit 1
            fi
          done
          exit "${failed}"

      - name: Entrenar el LLM de extremo a extremo
        if: runner.os != 'Windows'
        run: |
          ./build/train_llm --max_iters 5 --batch_size 2 --block_size 16 \
                            --n_layer 2 --n_head 2 --n_embd 32

  # Compara contra la implementacion de referencia en PyTorch. Es la unica
  # comprobacion que detecta que un Forward calcule algo distinto de lo que dice
  # calcular; el gradient checking, por construccion, no puede verlo.
  parity:
    name: Paridad con PyTorch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clonar la implementacion de referencia
        uses: actions/checkout@v4
        with:
          repository: iztaneo/LLMRasec
          path: LLMRasec

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar PyTorch (solo CPU)
        run: |
          python -m venv LLMRasec/venv
          LLMRasec/venv/bin/pip install --upgrade pip
          LLMRasec/venv/bin/pip install --index-url https://download.pytorch.org/whl/cpu torch
          LLMRasec/venv/bin/pip install numpy pillow

      - name: Configurar y compilar
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Comparar GPT, LSTM, BiLSTM y CRNN contra PyTorch
        run: tools/parity/run_parity.sh "${GITHUB_WORKSPACE}/LLMRasec"

      # El decodificador de imagen se contrasta contra Pillow, que ya esta
      # instalado en este entorno. El criterio es mas estricto que el de la
      # paridad numerica: aqui no hay punto flotante de por medio, asi que la
      # igualdad tiene que ser byte a byte.
      - name: Comparar el decodificador de imagen contra Pillow
        run: tools/image/run_image_parity.sh "${GITHUB_WORKSPACE}/LLMRasec"

  # Los sanitizers detectan accesos invalidos y comportamiento indefinido que
  # las pruebas numericas pueden atravesar sin dar sintoma.
  #
  # No se pudo comprobar en local: sobre macOS con AppleClang el binario
  # instrumentado se queda colgado al arrancar, incluso una demo que sin
  # instrumentar tarda milisegundos. Aqui, sobre Linux, paso a la primera, lo
  # que confirma que aquel cuelgue era del toolchain y no del codigo.
  sanitizers:
    name: ASan y UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # RelWithDebInfo y no Debug: los sanitizers ya multiplican el coste, y con
      # -O0 los bucles anidados de Conv2D y de los gradient checks tardan tanto
      # que el job deja de ser util. Con optimizacion se conservan los simbolos
      # y ASan detecta igual los accesos invalidos.
      - name: Configurar con sanitizers
        env:
          CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer -g
          LDFLAGS: -fsanitize=address,undefined
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Compilar
        run: cmake --build build --parallel

      - name: Pruebas bajo sanitizers
        working-directory: build
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --output-on-failure --timeout 900
